name: Build & Merge Crypto Features

on:
  schedule:
    - cron: "0 7 * * *"     # 12:30 PM IST
    - cron: "0 19 * * *"    # 12:30 AM IST
  workflow_dispatch:

jobs:

  feature-engineering:
    name: Step 1 — Feature Engineering
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Feature Engineering
        run: python feature_engineering_v3.py --mode full --force-heavy

      - name: Upload Feature Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: features
          path: data/features/*.parquet


  master-merge:
    name: Step 2 — Master Feature Merge
    runs-on: ubuntu-latest
    needs: feature-engineering

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Feature Artifacts
        uses: actions/download-artifact@v4
        with:
          name: features
          path: data/features/

      - name: Run Master Merge
        run: python master_features.py --mode full

      - name: Upload Master Feature Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: master_features
          path: data/master_features/*.parquet
