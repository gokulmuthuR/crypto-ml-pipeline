name: Build & Merge Crypto Features

on:
  schedule:
    - cron: "0 7 * * *"   # 12:30 PM IST
    - cron: "0 19 * * *"  # 12:30 AM IST
  workflow_dispatch: {}

jobs:

  feature-engineering:
    name: Step 1 — Feature Engineering
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python feature_engineering_v3.py

      - name: Commit Feature Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/features/*.parquet || true
          git commit -m "Auto-update features" || echo "No changes to commit"
          git push || echo "No push needed"


  master-merge:
    name: Step 2 — Master Feature Merge
    runs-on: ubuntu-latest
    needs: feature-engineering

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python master_f.py

      - name: Commit Master Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/master_features/*.parquet || true
          git commit -m "Auto-update master merged features" || echo "No changes to commit"
          git push || echo "No push needed"
