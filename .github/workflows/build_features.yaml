name: Build & Merge Crypto Features

on:
  schedule:
    - cron: "0 7 * * *"   # 12:30 PM IST
    - cron: "0 19 * * *"  # 12:30 AM IST
  workflow_dispatch: {}     # manual trigger

env:
  NUMBA_DISABLE_JIT: "0"     # allow numba, you can set to 1 if fails

jobs:
  feature-engineering:
    name: Step 1 — Feature Engineering
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies (fast UV install)
        run: |
          pip install uv
          uv pip install -r requirements.txt --system
          uv pip install numba --system  # ensure numba installed

      - name: Run Feature Engineering
        run: python feature_engineering_v3.py


  master-merge:
    name: Step 2 — Master Feature Merge
    runs-on: ubuntu-latest
    needs: feature-engineering   # ✅ only run if step 1 succeeds

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies (fast UV install)
        run: |
          pip install uv
          uv pip install -r requirements.txt --system
          uv pip install numba --system

      # Optional: disable Numba if memory error starts happening
      - name: Safe Mode — Set Numba fallback
        if: failure()
        run: echo "NUMBA_DISABLE_JIT=1" >> $GITHUB_ENV

      - name: Run Master Merge
        run: python master_features.py
