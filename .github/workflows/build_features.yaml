name: Build & Merge Crypto Features

on:
  schedule:
    - cron: "0 7 * * *"   # 12:30 PM IST
    - cron: "0 19 * * *"  # 12:30 AM IST
  workflow_dispatch:

jobs:

  feature-engineering:
    name: Step 1 — Feature Engineering
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Feature Engineering
        run: python feature_engineering_v3.py --mode full --force-heavy

      - name: Commit Feature Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Remove old outputs and add new ones
          git rm -rf data/features/*.parquet || true
          git add data/features/*.parquet

          git commit -m "🧠 Feature Update $(date)" || echo "No feature changes"

          # Pull + rebase to avoid conflicts
          git pull --rebase --autostash || true
          
          # Push with retry to avoid 408 errors
          for i in {1..5}; do git push && break || sleep 10; done


  master-merge:
    name: Step 2 — Master Feature Merge
    runs-on: ubuntu-latest
    needs: feature-engineering

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Master Merge
        run: python master_features.py --mode full

      - name: Commit Master Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git rm -rf data/master_features/*.parquet || true
          git add data/master_features/*.parquet

          git commit -m "📦 Master Feature Update $(date)" || echo "No master changes"

          git pull --rebase --autostash || true

          for i in {1..5}; do git push && break || sleep 10; done
